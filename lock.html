<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шиндовс Кирпич Семен</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
<style>
    * {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * {
        scrollbar-width: none;
        -ms-overflow-style: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;    
        outline: none;
        transition: all 0.3s;
        }
        *::-webkit-scrollbar {
            display: none;
        }

    body {
        background: url('lock.png') center/cover no-repeat;
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        overflow-y: hidden;
        position: relative;
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: black;
        opacity: 0;
        pointer-events: none;
        z-index: 2000;
        transition: opacity 0.3s ease;
    }

    body.dim::before {
        opacity: 1;
    }

    .threed {
        transform-style: preserve-3d;
        transform-origin: left center;
        animation: modern_anim_open 1s forwards;
    }

    @keyframes modern_anim_open {
        0% { transform: rotateY(-70deg); opacity: 0; }
        100% { transform: rotateY(0deg); opacity: 1; }
    }

    @keyframes modern_anim_close {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(-70deg); opacity: 0; }
    }

    .lockscreen {
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
        padding: 70px 30px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        position: fixed;
        top: 0px;
        transition: top 0.5s ease-in-out;
        z-index: 1000;

        & h1 {
            color: white;
            font-weight: 100;
            font-size: 70px;
        }

        & p {
            color: white;
            font-size: 20px;
        }
    }
    .passwordscreen {
        width: 100%;
        height: 100dvh;
        box-sizing: border-box;
        position: fixed;
        top: 0px;
        z-index: 90;
        opacity: 0;
        transition: opacity 0.3s ease;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(10px);
        display: flex;
        flex-direction: column;
        padding: 30px;
        align-items: center;
        justify-content: flex-end;
        gap: 20px;

        & h1 {
            color: white;
            font-weight: 100;
            font-size: 70px;
        }

        & p {
            color: white;
            font-size: 20px;
        }

        & #passwordspan {
            width: 100%;
            height: 40px;
            border: 1.5px solid white;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            box-sizing: border-box;
            padding: 0 10px;
        }

        & .keypad {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            & button {
                padding: 5px 0;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 0px;
                border: 0;
                background: 0;

                & i { font-size: 30px; }
                & p, span, i { color: white; }
            }
        }
    }

    .lockk {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-end;
        gap: 20px;
        width: 100%;
        /*width: calc(100% - 60px);*/
    }
</style>
</head>
<body>
    <div id="firstlockscreen" onclick="unlock()" class="lockscreen">
        <h1 id="time">00:00</h1>
        <p>Тыкни для открытия</p>
    </div>
    <div id="secondlockscreen" class="passwordscreen">
        <div class="lockk">
            <p>ну какой же?)</p>
            <span id="passwordspan"></span>
            <div class="keypad">
                <button onclick="setnum('1')"><p>Uno</p><span>1</span></button>
                <button onclick="setnum('2')"><p>Dos</p><span>2</span></button>
                <button onclick="setnum('3')"><p>Tres</p><span>3</span></button>
                <button onclick="setnum('4')"><p>Cuatro</p><span>4</span></button>
                <button onclick="setnum('5')"><p>Cinco</p><span>5</span></button>
                <button onclick="setnum('6')"><p>Seis</p><span>6</span></button>
                <button onclick="setnum('7')"><p>Siete</p><span>7</span></button>
                <button onclick="setnum('8')"><p>Ocho</p><span>8</span></button>
                <button onclick="setnum('9')"><p>Nueve</p><span>9</span></button>
                <button onclick="deleteLast()"><i class="fas fa-backspace"></i></button>
                <button onclick="setnum('0')"><p>Cero</p><span>0</span></button>
                <button onclick="chekpass()"><p>Oки</p></button>
            </div>
        </div>
    </div>
    <script>
        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const timeString = `${hours}:${minutes}`;

            document.getElementById("time").textContent = timeString;
        }

        setInterval(updateTime, 1000);
        updateTime();

        function unlock() {
            document.getElementById("firstlockscreen").style.top = "-100vh";
            setTimeout(() => {
                if (localStorage.getItem("Brickpassword")) {
                    document.getElementById("secondlockscreen").style.opacity = "1"
                } else {
                    document.body.classList.add("dim");
                    setTimeout(() => {
                        window.location.href = "mainscreen.html";
                    }, 300);
                };
            }, 500);
        }

        let passwordc = "";
        function setnum(num) {
            if (passwordc.length > 20) return;
            passwordc += num;
            document.getElementById("passwordspan").textContent = passwordc;
        }
        function deleteLast() {
            passwordc = passwordc.slice(0, -1);
            document.getElementById('passwordspan').textContent = passwordc;
        }
        function chekpass() {
            if (passwordc == localStorage.getItem("Brickpassword")) {
                document.getElementById("secondlockscreen").style.opacity = "0"
                document.body.classList.add("dim");
                setTimeout(() => {
                    window.location.href = "mainscreen.html";
                }, 300);
            } else {
                document.getElementById('passwordspan').style.color = "#a90c0c";
                setTimeout(() => {
                    document.getElementById('passwordspan').textContent = "";
                    passwordc = "";
                    document.getElementById('passwordspan').style.color = "white";
                }, 300)
                
            }
        }
    </script>
</body>
</html>
