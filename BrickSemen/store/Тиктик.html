<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        *  {
        color: white;
        padding: 0; margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * {
        scrollbar-width: none;
        -ms-overflow-style: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;    
        outline: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }

    .threed {
        transform-style: preserve-3d;
        transform-origin: left center;
        animation: modern_anim_open 1s forwards;
    }

    @keyframes modern_anim_open {
        0% { transform: rotateY(-70deg); opacity: 0; }
        100% { transform: rotateY(0deg); opacity: 1; }
    }

    @keyframes modern_anim_close {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(-70deg); opacity: 0; }
    }
    
    h1 {
        font-weight: 400;
        font-size: 35px;
    }
    h2 {
        font-weight: 400;
        font-size: 30px;
    }
    button {
        text-align: left;
        background: 0; border: 0;
        font-size: 15px;
        color: #807F84;
        &.def { color: white; }
        &.border { box-sizing: border-box; padding: 5px 15px; border: 1.5px solid white; }
    }
    hr {
        width: 100%;
        border: 1px solid #807F84;
    }

    body {
        background: black;
        width: 100%;
        height: calc(100vh - 40px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .header {
        width: 100%;
        max-width: 100%;
        height: auto;
        align-items: center;
        display: flex;
        overflow-x: scroll;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        flex-wrap: nowrap;
        box-sizing: border-box;
        gap: 15px;
        height: 10vh;
        padding: 0px 10px 0px 10px;

        & button {
            height: 100%;
            font-size: 7vh;
            font-weight: 400;
            background: 0;
            border: 0;
            color: #807F84;
            display: flex;
            align-items: center;
            white-space: nowrap;
            flex-shrink: 0;

            &.active { color: white; }
        }
    }

    .mainsrc {
        background: black;
        width: 100%;
        box-sizing: border-box;
        flex: 1;
        display: none;

        &.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
        }

        & .circle {
            width: 70%;
            background: #1F1F1F;
            aspect-ratio: 1 / 1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }
    }

    .notification {
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        background: #1F1F1F;
        box-sizing: border-box;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
        transition: all 0.5s;

        & p { font-size: 20px; }
        & button { 
            margin-top: 5px;
            box-sizing: border-box;
            padding: 5px 15px;
            border: 1.5px solid white;    
        }
    }

    .footer {
        background: black;
        width: 100%;
        display: flex;
        height: 50px;
        box-sizing: border-box;
        padding: 10px;
        gap: 10px;

        & button {
            height: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid white;
            border-radius: 50%;

            & img { height: 50%; filter: invert(1); }
        }

        & input {
            flex: 1;
            height: 100%;
            background: white;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            color: black;
            padding: 0px 5px 0px 5px;
        }
    }
    </style>
</head>
<body>
    <div class="header">
        <button id="butt1" onclick="changesreen(1)" class="active">Часы</button>
        <button id="butt2" onclick="changesreen(2)" >МИНтсы</button>
        <button id="butt3" onclick="changesreen(3)" >1 192 631 770 периодам излучения при переходе атома цезия-133 между уровнями энергии</button>
    </div>
    <div id="1" class="mainsrc active">
        <div class="circle">
            <p id="hours">000</p>
        </div>
    </div>
    <div id="2" class="mainsrc">
        <div class="circle">
            <p id="minutes">100</p>
        </div>
    </div>
    <div id="3" class="mainsrc">
        <div class="circle">
            <p id="seconds">200</p>
        </div>
    </div>
    <div id="notblock" class="notification">
        <p id="notificationtext">Текст</p>
        <span id="notabout">Больше ничего и не надо</span>
        <button class="def" onclick="notification(0)">С кайфом</button>
    </div>
    <!--<div class="footer">
        <button><img src="arrow.png" alt="arrow"></button>
        <input type="text">
        <button><img src="arrow.png" alt="arrow"></button>
    </div>-->
    <script>

        function changesreen(id) {
            for (let index = 1; index < 4; index++) {
                document.getElementById(String(index)).classList.remove("active");
                if (id < 4) { if (index < 4) { document.getElementById("butt" + String(index)).classList.remove("active"); } }
            };
            document.getElementById(String(id)).classList.add("active");
            if (id < 4) document.getElementById("butt" + String(id)).classList.add("active");
        };

        function updateTime() {
            const now = new Date();
            const hours = now.getHours().toString().padStart(2, '0');
            const minutes = now.getMinutes().toString().padStart(2, '0');
            const seconds = now.getSeconds().toString().padStart(2, '0');

            document.getElementById("hours").textContent = hours;
            document.getElementById("minutes").textContent = minutes;
            document.getElementById("seconds").textContent = seconds;
        }
        updateTime();
        setInterval(updateTime, 1000);

        function notification(name, why) {
            if (name == 0) { document.getElementById("notblock").style.top = "-200px"; return; };
            document.getElementById("notblock").style.top = "0px";
            document.getElementById("notabout").textContent = name;
            if (why == 1) {
                document.getElementById("notificationtext").textContent = "Приложение " + name + " не выделывается и с кайфом работает";
            };
        };
    </script>
</body>
</html>
