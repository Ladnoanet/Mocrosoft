<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Шиндовс Кирпич Семен</title>
<style>
    * {
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: white;
        width: 100%;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 300px;
        box-sizing: border-box;
        padding: 20px;
        transition: background 1s ease;
    }

    .threed {
        transform-style: preserve-3d;
        transform-origin: left center;
        width: 70%;
        animation: modern_anim_open 1s forwards;
    }

    @keyframes modern_anim_open {
        0% { transform: rotateY(-70deg); opacity: 0; display: none; }
        100% { transform: rotateY(0deg); }
    }

    @keyframes modern_anim_close {
        0% { transform: rotateY(0deg); }
        100% { transform: rotateY(-70deg); opacity: 0; display: none; }
    }
</style>
</head>
<body>
    <img id="logo" class="threed" src="winlogo.png" alt="winlogo">
    <script>
        const logo = document.getElementById("logo");
        setTimeout(() => {
            logo.style.animation = "modern_anim_close 1s forwards";
            document.body.style.background = "black";
            setTimeout(() => {
                window.location.href = 'mainscreen.html';
            }, 1200);
        }, 2000);
    </script>
</body>
</html>
