<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

    <style>
        *  {
        color: white;
        padding: 0; margin: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    * {
        scrollbar-width: none;
        -ms-overflow-style: none;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;    
        outline: none;
        }
        *::-webkit-scrollbar {
            display: none;
        }

    .threed {
        transform-style: preserve-3d;
        transform-origin: left center;
        animation: modern_anim_open 1s forwards;
    }

    @keyframes modern_anim_open {
        0% { transform: rotateY(-70deg); opacity: 0; }
        100% { transform: rotateY(0deg); opacity: 1; }
    }

    @keyframes modern_anim_close {
        0% { transform: rotateY(0deg); opacity: 1; }
        100% { transform: rotateY(-70deg); opacity: 0; }
    }
    
    h1 {
        font-weight: 400;
        font-size: 35px;
    }
    h2 {
        font-weight: 400;
        font-size: 30px;
    }
    button {
        text-align: left;
        background: 0; border: 0;
        font-size: 15px;
        color: #807F84;
        &.def { color: white; }
        &.border { box-sizing: border-box; padding: 5px 15px; border: 1.5px solid white; }
    }
    hr {
        width: 100%;
        border: 1px solid #807F84;
    }

    body {
        background: black;
        width: 100%;
        height: calc(100vh - 40px);
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
    }

    .header {
        width: 100%;
        max-width: 100%;
        height: auto;
        align-items: center;
        display: flex;
        overflow-x: scroll;
        -webkit-overflow-scrolling: touch;
        touch-action: pan-x;
        flex-wrap: nowrap;
        box-sizing: border-box;
        gap: 15px;
        height: 10vh;
        padding: 0px 10px 0px 10px;
        flex-shrink: 0;

        & button {
            height: 100%;
            font-size: 7vh;
            font-weight: 400;
            background: 0;
            border: 0;
            color: #807F84;
            display: flex;
            align-items: center;
            white-space: nowrap;
            flex-shrink: 0;

            &.active { color: white; }
        }
    }

    .mainsrc {
        background: rgb(0, 0, 0);
        width: 100%;
        box-sizing: border-box;
        flex: 1;
        display: none;
        padding: 20px;
        padding-bottom: 100px;

        &.active {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
        }
    }

    .notification {
        position: fixed;
        top: -200px;
        left: 50%;
        transform: translateX(-50%);
        width: 100%;
        background: #1F1F1F;
        box-sizing: border-box;
        padding: 15px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        align-items: flex-start;
        transition: all 0.5s;

        & p { font-size: 20px; }
        & button { 
            margin-top: 5px;
            box-sizing: border-box;
            padding: 5px 15px;
            border: 1.5px solid white;    
        }
    }

    .footer {
        background: black;
        width: 100%;
        display: flex;
        height: 50px;
        box-sizing: border-box;
        padding: 10px;
        gap: 10px;

        & button {
            height: 100%;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1.5px solid white;
            border-radius: 50%;

            & img { height: 50%; filter: invert(1); }
        }

        & input {
            flex: 1;
            height: 100%;
            background: white;
            box-sizing: border-box;
            border: 0;
            border-radius: 0;
            color: black;
            padding: 0px 5px 0px 5px;
        }
    }

    .app {
        width: 100%;
        display: flex;
        gap: 10px;
        font-size: 25px;
        align-items: center;

        & .appico {
            width: 60px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            & img { height: 50%; }
        }
    }

    .new {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        overflow-y: auto;

        & .appp {
            width: 25vh;
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            & img { height: 50%; }
        }
    }

    .appmain {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
        & .appicoother {
            width: 17vh;
            /*height: 100%;*/
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            & img { height: 50%; }
        }
        & .appother {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: flex-start;
            & p { font-size: 22px; }
            & button { color: white; }
        }
    }
    </style>
</head>
<body>
    <div class="header">
        <button id="butt1" onclick="changesreen(1)" class="active">ПВЗ оЗонт</button>
    </div>
    <div id="1" class="mainsrc active">
        <div class="new">
            <div class="appp colorel"><img src="./store/store-нампад.png" alt=""></div>
            <div class="appp colorel"><img src="./store/store-писанина.png" alt=""></div>
            <div class="appp colorel"><img src="./store/store-тиктик.png" alt=""></div>
        </div>
        <h1>Всее</h1>
        <div onclick="changesreen(2); setapp(1)" class="app">
            <div class="appico colorel"><img src="./store/store-нампад.png"></div>
            <span>Нампад</span>
        </div>
        <div onclick="changesreen(2); setapp(2)" class="app">
            <div class="appico colorel"><img src="./store/store-писанина.png"></div>
            <span>Писанина</span>
        </div>
        <div onclick="changesreen(2); setapp(3)" class="app">
            <div class="appico colorel"><img src="./store/store-тиктик.png"></div>
            <span>Тиктик</span>
        </div>
    </div>
    <div id="2" class="mainsrc">
        <div class="appmain">
            <div class="appicoother colorel">
                <img id="appico" src="" alt="">
            </div>
            <div class="appother">
                <p id="nameofappp">Название приложения</p>
                <button id="downloadbutton" onclick="download()" class="active border">Качать бля</button>
            </div>
        </div>
        <p id="aboutapp">
            О приложении
        </p>
    </div>
    <div id="notblock" class="notification">
        <p id="notificationtext">Текст</p>
        <span id="notabout">Больше ничего и не надо</span>
        <button class="def" onclick="notification(0)">С кайфом</button>
    </div>
    <!--<div class="footer">
        <button><img src="arrow.png" alt="arrow"></button>
        <input type="text">
        <button><img src="arrow.png" alt="arrow"></button>
    </div>-->
    <script>

        function changesreen(id) {
            for (let index = 1; index < 3; index++) {
                document.getElementById(String(index)).classList.remove("active");
                if (id < 2) { if (index < 2) { document.getElementById("butt" + String(index)).classList.remove("active"); } }
            };
            document.getElementById(String(id)).classList.add("active");
            if (id < 2) document.getElementById("butt" + String(id)).classList.add("active");
        };

        function notification(name, why) {
            if (name == 0) { document.getElementById("notblock").style.top = "-200px"; return; };
            document.getElementById("notblock").style.top = "0px";
            document.getElementById("notabout").textContent = name;
            if (why == 1) {
                document.getElementById("notificationtext").textContent = "Приложение " + name + " не выделывается и с кайфом работает";
            };
        };

        document.querySelectorAll(".colorel").forEach(el => {
            el.style.background = localStorage.getItem("BrickTheme");
        });

        let currentapp = "";
        const apps = {
            1: ["Нампад", "нампад", "Тыкай цифры и считай свои миллионы 😎"],
            2: ["Писанина", "писанина", "Понаписывай че те надо и похуй"],
            3: ["Тиктик", "тиктик", "Не перепутай. Это тебе не деградировать, постоянно откладывая дела на потом, позже развивая свою лень и прокрастинацию до предела, в будущем осознавая, что ты ничего не добился, что приводит к мыслям, которые влекут за собой нечто по настоящему страшное, и ты уже не совсем осознаешь смысл всего этого, думая, что лучше просто... а похуй."]
        }
        function setapp(number) {
            document.getElementById("appico").src = "./store/store-" + apps[number][1] + ".png";
            document.getElementById("nameofappp").textContent = apps[number][0];
            document.getElementById("aboutapp").textContent = apps[number][2];
            currentapp = number;

            let isappin = JSON.parse(localStorage.getItem("brickapps")) || [];
            if (isappin.includes(number)) {
                document.getElementById("downloadbutton").textContent = "Удалить";
            } else {
                document.getElementById("downloadbutton").textContent = "Скачать";
            }
        }

        function download() {
            document.getElementById("downloadbutton").textContent = "Делаю...";
            setTimeout(() => {
                let brickapps = JSON.parse(localStorage.getItem("brickapps")) || [];
                if (!brickapps.includes(currentapp)) {
                    brickapps.push(currentapp);
                    localStorage.setItem("brickapps", JSON.stringify(brickapps));
                } else {
                    brickapps.splice(brickapps.indexOf(currentapp), 1);
                    localStorage.setItem("brickapps", JSON.stringify(brickapps));
                }

                if (brickapps.includes(currentapp)) {
                    window.parent.postMessage({ cmd: "closeapp" }, "*");
                    document.getElementById("downloadbutton").textContent = "Удалить";
                } else {
                    document.getElementById("downloadbutton").textContent = "Скачать";
                }

                window.parent.postMessage({ cmd: "appactions" }, "*");
            }, 1000);
        }
    </script>
</body>
</html>
